<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>trade-fish</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
  {% block head %}{% endblock %}
</head>
<body>
  <nav>
    <span class="logo">trade-fish</span>
    <span class="ticker"><span id="tick-dot" class="dot"></span><span id="tick-text"></span></span>
    <span class="links">
      <a href="/">dashboard</a>
      <a href="/settings">settings</a>
      <a href="/logout">logout</a>
    </span>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <script>
    const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    async function poll() {
      try {
        const r = await fetch('/api/activity');
        if (!r.ok || r.redirected) return;
        const d = await r.json();
        document.getElementById('tick-dot').className = 'dot ' + d.status.state;
        document.getElementById('tick-text').textContent = d.status.text;
        const feed = document.getElementById('log-feed');
        if (feed) {
          const stick = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 40;
          feed.innerHTML = d.logs.map(l =>
            `<div class="log-line ${l.level}"><span class="log-ts">${l.ts}</span> <span class="log-name">${esc(l.name)}</span> ${esc(l.msg)}</div>`
          ).join('') || '<p class="muted">no activity yet</p>';
          if (stick) feed.scrollTop = feed.scrollHeight;
        }
      } catch (e) {}
    }
    poll(); setInterval(poll, 5000);
  </script>
</body>
</html>
